<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogos Camisetikas</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #14171d; color: #e7e9ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }
      header {
        grid-column: 1 / -1;
        background: #0a0c10;
        border-bottom: 1px solid #1f242c;
        padding: 10px 16px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      .sidebar {
        background: #14171d;
        border-right: 1px solid #1f242c;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
      }
      .sidebar-title {
        padding: 12px 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #8a93a3;
        text-transform: uppercase;
        border-bottom: 1px solid #1f242c;
      }
      .catalog-list {
        list-style: none;
        margin: 0;
        padding: 8px;
        flex: 1;
      }
      .catalog-list li {
        padding: 10px;
        margin: 4px 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
        color: #b6bcc7;
      }
      .catalog-list li:hover {
        background: #1a1f27;
        color: #e7e9ee;
      }
      .catalog-list li.active {
        background: #2a3340;
        color: #e7e9ee;
        outline: 1px solid #3b82f6;
      }
      .viewer {
        position: relative;
        background: #0a0c10;
        display: flex;
        flex-direction: column;
      }
      #cargando {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 14px;
        background: #0a0c10; z-index: 5;
        transition: opacity .4s ease;
      }
      #cargando h2 { margin: 0; font-size: 16px; }
      #cargando p { margin: 0; color: #8a93a3; font-size: 12px; }
      .spinner {
        width: 32px; height: 32px;
        border: 3px solid #2a3340; border-top-color: #3b82f6;
        border-radius: 50%; animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      iframe#pdf {
        flex: 1;
        width: 100%;
        border: 0;
        background: #1f242c;
      }
      @media (max-width: 720px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto 1fr;
        }
        header { grid-column: 1; }
        .sidebar {
          grid-column: 1;
          max-height: 200px;
          border-right: 0;
          border-bottom: 1px solid #1f242c;
        }
      }
    </style>
  </head>
  <body>
    <header>CATÁLOGOS CAMISETIKAS</header>
    
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">Catálogos</div>
        <ul class="catalog-list" id="catalogosList"></ul>
      </aside>

      <section class="viewer">
        <div id="cargando" style="display: none">
          <div class="spinner"></div>
          <h2 id="cargandoTitulo">Cargando...</h2>
          <p>Puedes empezar a verlo en cuanto aparezca</p>
        </div>
        <iframe id="pdf" title="Catálogo"></iframe>
      </section>
    </div>

    <script>
      (async () => {
        const list = document.getElementById('catalogosList');
        const iframe = document.getElementById('pdf');
        const cargando = document.getElementById('cargando');
        const cargandoTitulo = document.getElementById('cargandoTitulo');
        
        // Obtener lista de PDFs dinámicamente
        let catalogos = [];
        try {
          const res = await fetch('/catalogos.json');
          if (res.ok) {
            const data = await res.json();
            catalogos = data.catalogos || [];
          }
        } catch (e) {
          console.error('Error cargando catalogos.json:', e);
        }
        
        if (catalogos.length === 0) {
          list.innerHTML = '<li style="color: #8a93a3">Sin catálogos</li>';
          return;
        }

        // Renderizar lista
        catalogos.forEach((cat, idx) => {
          const li = document.createElement('li');
          li.dataset.url = cat.url;
          li.dataset.nombre = cat.nombre;
          li.textContent = cat.nombre;
          li.addEventListener('click', () => abrirCatalogo(cat, li));
          list.appendChild(li);
        });

        // Abrir el primero por defecto
        const primerLi = list.querySelector('li');
        if (primerLi) {
          abrirCatalogo(catalogos[0], primerLi);
        }

        function abrirCatalogo(cat, liElement) {
          document.querySelectorAll('.catalog-list li.active')
            .forEach(el => el.classList.remove('active'));
          liElement.classList.add('active');
          
          cargando.style.display = 'flex';
          cargandoTitulo.textContent = cat.nombre;
          iframe.src = cat.url + '#view=FitH&toolbar=1&navpanes=1';
          setTimeout(() => {
            cargando.style.display = 'none';
          }, 1000);
        }
      })();
    </script>
  </body>
</html>
